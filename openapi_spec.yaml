openapi: 3.0.3
info:
  title: YUNO AI — Agent Orchestration Platform API
  version: 1.2.0
  description: |
    REST + WebSocket API for the YUNO AI Agent Orchestration Platform.
    Interactive docs: http://localhost:8000/docs

    ### What's new in v1.2
    - `skills` and `interaction_rules` fields on agents
    - `guardrails` enforced at runtime (input + output blocking)
    - `max_iterations` on workflows for loop / cycle safety
    - Schedule management endpoints (`POST /{id}/schedule`, `GET /scheduled/list`)
    - `guardrail_blocked` field on execution results and logs

servers:
  - url: http://localhost:8000
    description: Local development

tags:
  - name: agents
    description: Agent CRUD, configuration, and single-agent execution
  - name: workflows
    description: Workflow CRUD, templates, scheduling, and execution
  - name: messages
    description: Inter-agent and external message history
  - name: execution
    description: Per-workflow execution logs
  - name: websocket
    description: Real-time streaming (WebSocket upgrade)
  - name: health
    description: Service health checks

paths:

  # ── Agents ──────────────────────────────────────────────────────────────────

  /api/agents:
    get:
      tags: [agents]
      summary: List all agents
      responses:
        '200':
          description: Array of agent objects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Agent'
    post:
      tags: [agents]
      summary: Create a new agent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentCreate'
            example:
              name: Researcher
              role: Web Researcher
              system_prompt: You are an expert researcher.
              model: gemini-3-flash-preview
              tools: [web_search, datetime_now]
              channels: [telegram]
              memory_config:
                window_size: 20
                memory_type: sliding_window
              guardrails:
                banned_keywords: [violence, hate]
                blocked_topics: [gambling]
                max_input_tokens: 2000
                max_output_tokens: 1000
                require_safe_response: true
              skills:
                - name: summarize
                  description: Summarizes long text into key points
                  enabled: true
              interaction_rules:
                response_format: text
                language: English
                temperature: 0.7
                max_turns: 10
      responses:
        '200':
          description: Created agent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
        '409':
          description: Agent name already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/agents/{agent_id}:
    parameters:
      - $ref: '#/components/parameters/AgentId'
    get:
      tags: [agents]
      summary: Get agent by ID
      responses:
        '200':
          description: Agent object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [agents]
      summary: Update agent (only provided fields are changed)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentUpdate'
      responses:
        '200':
          description: Updated agent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [agents]
      summary: Delete agent
      responses:
        '200':
          description: Deletion confirmed
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: deleted
                  agent_id:
                    type: string
                    format: uuid
        '404':
          $ref: '#/components/responses/NotFound'

  /api/agents/{agent_id}/tools:
    patch:
      tags: [agents]
      summary: Replace agent tool list
      parameters:
        - $ref: '#/components/parameters/AgentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tools]
              properties:
                tools:
                  type: array
                  items:
                    type: string
                  example: [calculator, web_search]
      responses:
        '200':
          description: Updated agent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/agents/{agent_id}/channels:
    patch:
      tags: [agents]
      summary: Replace agent channel list
      parameters:
        - $ref: '#/components/parameters/AgentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channels]
              properties:
                channels:
                  type: array
                  items:
                    type: string
                  example: [telegram]
      responses:
        '200':
          description: Updated agent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/agents/{agent_id}/execute:
    post:
      tags: [agents]
      summary: Execute a single agent
      description: |
        Guardrails are enforced at runtime:
        - **Input** is checked against `banned_keywords`, `blocked_topics`, and `max_input_tokens` before processing.
        - **Output** is checked against the same rules; long responses are soft-truncated by `max_output_tokens`.
        - Blocked steps return `guardrail_blocked: true` and record `status: guardrail_blocked` in execution logs.
      parameters:
        - $ref: '#/components/parameters/AgentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                input:
                  type: string
                  description: Prompt / user message
                  example: What is 42 * 7?
                workflow_id:
                  type: string
                  format: uuid
                  description: Associate execution with a workflow (optional)
      responses:
        '200':
          description: Execution result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentExecutionResult'
        '404':
          $ref: '#/components/responses/NotFound'

  # ── Workflows ────────────────────────────────────────────────────────────────

  /api/workflows:
    get:
      tags: [workflows]
      summary: List all workflows
      responses:
        '200':
          description: Array of workflow objects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Workflow'
    post:
      tags: [workflows]
      summary: Create a workflow
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowCreate'
            example:
              name: Research & Summarise
              description: Two-agent pipeline
              agents: []
              graph:
                nodes: []
                edges: []
              schedule: "0 9 * * 1-5"
              max_iterations: 10
              template_name: research_summarize
      responses:
        '200':
          description: Created workflow
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workflow'

  /api/workflows/templates:
    get:
      tags: [workflows]
      summary: List built-in workflow templates
      responses:
        '200':
          description: Array of template descriptors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkflowTemplate'

  /api/workflows/scheduled/list:
    get:
      tags: [workflows]
      summary: List all active cron-scheduled workflows
      description: Returns every workflow that currently has a registered APScheduler job.
      responses:
        '200':
          description: Scheduled job list
          content:
            application/json:
              schema:
                type: object
                properties:
                  scheduled:
                    type: array
                    items:
                      type: object
                      properties:
                        workflow_id:
                          type: string
                          format: uuid
                        next_run:
                          type: string
                          format: date-time
                          nullable: true
                        trigger:
                          type: string
                          example: "cron[minute='0', hour='9', day='*', month='*', day_of_week='mon-fri']"

  /api/workflows/{workflow_id}:
    parameters:
      - $ref: '#/components/parameters/WorkflowId'
    get:
      tags: [workflows]
      summary: Get workflow by ID
      responses:
        '200':
          description: Workflow object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workflow'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [workflows]
      summary: Update workflow
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowUpdate'
      responses:
        '200':
          description: Updated workflow
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workflow'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [workflows]
      summary: Delete workflow
      responses:
        '200':
          description: Deletion confirmed
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: deleted
                  workflow_id:
                    type: string
                    format: uuid
        '404':
          $ref: '#/components/responses/NotFound'

  /api/workflows/{workflow_id}/execute:
    post:
      tags: [workflows]
      summary: Execute a workflow end-to-end
      description: |
        Compiles the workflow graph into a LangGraph StateGraph and invokes it.

        **Cycle / loop support:** back-edges are permitted. Each node tracks its
        visit count in `state.iteration_counts`; a node that exceeds
        `workflow.max_iterations` terminates immediately and routes to END with a
        `[Loop limit reached]` message.

        Each agent node:
        - Enforces guardrails on input and output
        - Applies memory window from `memory_config.window_size`
        - Uses skills and interaction_rules when calling the LLM
        - Persists a Message + ExecutionLog row
        - Broadcasts a WebSocket event to `/ws/logs/{workflow_id}`
      parameters:
        - $ref: '#/components/parameters/WorkflowId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                input:
                  type: string
                  description: Initial prompt passed to the first agent node
                  example: What are the latest breakthroughs in AI in 2024?
      responses:
        '200':
          description: Execution result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowExecutionResult'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/workflows/{workflow_id}/status:
    get:
      tags: [workflows]
      summary: Get in-memory execution status
      parameters:
        - $ref: '#/components/parameters/WorkflowId'
      responses:
        '200':
          description: Status object
          content:
            application/json:
              schema:
                type: object
                properties:
                  workflow_id:
                    type: string
                    format: uuid
                  status:
                    type: string
                    enum: [running, completed, error, unknown]

  /api/workflows/{workflow_id}/schedule:
    post:
      tags: [workflows]
      summary: Set or clear the cron schedule for a workflow
      description: |
        Accepts a standard 5-field cron expression.  Pass `null` or an empty
        string to remove the schedule.

        **Cron examples**
        - `"*/5 * * * *"` — every 5 minutes
        - `"0 9 * * 1-5"` — 09:00 on weekdays
        - `"0 0 * * 0"`   — midnight on Sundays
      parameters:
        - $ref: '#/components/parameters/WorkflowId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                schedule:
                  type: string
                  nullable: true
                  example: "0 9 * * 1-5"
      responses:
        '200':
          description: Schedule updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  workflow_id:
                    type: string
                    format: uuid
                  schedule:
                    type: string
                    nullable: true
                  message:
                    type: string
                    example: "Schedule set to: 0 9 * * 1-5"
        '404':
          $ref: '#/components/responses/NotFound'

  # ── Messages ─────────────────────────────────────────────────────────────────

  /api/messages/{workflow_id}:
    get:
      tags: [messages]
      summary: Get message history for a workflow (chronological)
      parameters:
        - $ref: '#/components/parameters/WorkflowId'
      responses:
        '200':
          description: Ordered message array
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Message'

  # ── Execution Logs ───────────────────────────────────────────────────────────

  /api/execution/{workflow_id}/logs:
    get:
      tags: [execution]
      summary: Get execution logs for a workflow (chronological)
      parameters:
        - $ref: '#/components/parameters/WorkflowId'
      responses:
        '200':
          description: Ordered log array
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ExecutionLog'

  # ── WebSocket ────────────────────────────────────────────────────────────────

  /ws/logs/{workflow_id}:
    get:
      tags: [websocket]
      summary: Subscribe to workflow execution log stream (WebSocket)
      description: |
        Upgrade to WebSocket. Events emitted:
        - on connect:         `{"workflow_id":"…","status":"connected"}`
        - workflow_started:   `{"event":"workflow_started","agent_count":N,"workflow_name":"…"}`
        - agent_response:     `{"event":"agent_response","agent":"…","response":"…","tool_outputs":[…]}`
        - step_completed:     `{"event":"step_completed","agent":"…","response":"…","tool_outputs":[…]}`
        - workflow_completed: `{"event":"workflow_completed","final_output":"…","steps":N}`
      parameters:
        - name: workflow_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '101':
          description: Switching Protocols

  /ws/agent-status/{agent_id}:
    get:
      tags: [websocket]
      summary: Subscribe to agent state updates (WebSocket)
      description: |
        Events emitted:
        - on connect: `{"agent_id":"…","status":"connected"}`
        - running:    `{"status":"running","agent":"…"}`
        - idle:       `{"status":"idle","agent":"…","response_preview":"…"}`
      parameters:
        - name: agent_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '101':
          description: Switching Protocols

  # ── Health ───────────────────────────────────────────────────────────────────

  /api/health:
    get:
      tags: [health]
      summary: Application alive check
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  env:
                    type: string
                    example: development

  /api/health/db:
    get:
      tags: [health]
      summary: Database connectivity check
      responses:
        '200':
          description: DB status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [ok, error]
                  db:
                    type: string
                    example: connected

  /api/health/redis:
    get:
      tags: [health]
      summary: Redis connectivity check
      responses:
        '200':
          description: Redis status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [ok, degraded]
                  redis:
                    type: string
                    example: connected

# ── Reusable components ───────────────────────────────────────────────────────

components:

  parameters:
    AgentId:
      name: agent_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    WorkflowId:
      name: workflow_id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadRequest:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:

    Error:
      type: object
      properties:
        detail:
          type: string

    # ── Agent schemas ──────────────────────────────────────────────────────────

    AgentSkill:
      type: object
      required: [name]
      properties:
        name:
          type: string
          example: summarize
        description:
          type: string
          example: Summarizes long text into concise key points
        enabled:
          type: boolean
          default: true

    AgentGuardrails:
      type: object
      description: |
        Rules enforced at runtime on every agent step.
        Input violations hard-block the step; output violations truncate or block.
      properties:
        banned_keywords:
          type: array
          items:
            type: string
          description: Words/phrases that trigger a hard block if found in input or output
          example: [violence, hate]
        blocked_topics:
          type: array
          items:
            type: string
          description: Topic strings treated identically to banned_keywords
          example: [gambling, weapons]
        max_input_tokens:
          type: integer
          description: Approximate token cap on user input (word-count × 1.3 proxy)
          example: 2000
        max_output_tokens:
          type: integer
          description: Approximate token cap on agent response; exceeded output is truncated
          example: 1000
        require_safe_response:
          type: boolean
          description: If true, any guardrail violation hard-blocks instead of soft-truncating
          default: false

    AgentMemoryConfig:
      type: object
      description: Controls how much conversation history the agent retains between turns.
      properties:
        window_size:
          type: integer
          description: Number of individual messages to keep in the sliding window
          default: 20
          example: 10
        memory_type:
          type: string
          enum: [sliding_window, full]
          default: sliding_window

    AgentInteractionRules:
      type: object
      description: Controls how the agent formats responses and behaves during conversations.
      properties:
        response_format:
          type: string
          enum: [text, json, markdown]
          default: text
          description: Instructs the LLM to respond in this format
        language:
          type: string
          description: Instruct the agent to respond in a specific language
          example: Spanish
        temperature:
          type: number
          format: float
          minimum: 0
          maximum: 1
          default: 0.7
          description: LLM sampling temperature (0 = deterministic, 1 = creative)
        max_turns:
          type: integer
          description: Maximum conversation turns stored in memory
          default: 10

    Agent:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        role:
          type: string
          nullable: true
        system_prompt:
          type: string
          nullable: true
        model:
          type: string
          example: gemini-3-flash-preview
        tools:
          type: array
          items:
            type: string
          example: [web_search, calculator]
        channels:
          type: array
          items:
            type: string
          example: [telegram]
        memory_config:
          $ref: '#/components/schemas/AgentMemoryConfig'
        guardrails:
          $ref: '#/components/schemas/AgentGuardrails'
        skills:
          type: array
          items:
            $ref: '#/components/schemas/AgentSkill'
          description: Declarative capabilities appended to the system prompt
        interaction_rules:
          $ref: '#/components/schemas/AgentInteractionRules'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AgentCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
        role:
          type: string
        system_prompt:
          type: string
        model:
          type: string
          default: gemini-3-flash-preview
        tools:
          type: array
          items:
            type: string
        channels:
          type: array
          items:
            type: string
        memory_config:
          $ref: '#/components/schemas/AgentMemoryConfig'
        guardrails:
          $ref: '#/components/schemas/AgentGuardrails'
        skills:
          type: array
          items:
            $ref: '#/components/schemas/AgentSkill'
        interaction_rules:
          $ref: '#/components/schemas/AgentInteractionRules'

    AgentUpdate:
      type: object
      description: All fields optional — only provided fields are updated
      properties:
        role:
          type: string
        system_prompt:
          type: string
        model:
          type: string
        tools:
          type: array
          items:
            type: string
        channels:
          type: array
          items:
            type: string
        memory_config:
          $ref: '#/components/schemas/AgentMemoryConfig'
        guardrails:
          $ref: '#/components/schemas/AgentGuardrails'
        skills:
          type: array
          items:
            $ref: '#/components/schemas/AgentSkill'
        interaction_rules:
          $ref: '#/components/schemas/AgentInteractionRules'

    AgentExecutionResult:
      type: object
      properties:
        agent_id:
          type: string
          format: uuid
        response:
          type: string
        tool_outputs:
          type: array
          items:
            type: object
            properties:
              tool:
                type: string
              result:
                type: string
        guardrail_blocked:
          type: boolean
          description: True when the step was blocked by a guardrail rule

    # ── Workflow schemas ───────────────────────────────────────────────────────

    Workflow:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        agents:
          type: array
          items:
            type: string
            format: uuid
        graph:
          type: object
          description: |
            Graph descriptor.  Edges are stored as 2- or 3-element arrays:
            - `[src, dst]` — unconditional edge
            - `[src, dst, condition]` — conditional; fires when the previous
              agent's output contains the `condition` keyword (case-insensitive).
            Back-edges are permitted, enabling feedback loops.
          properties:
            nodes:
              type: array
              items:
                type: string
            edges:
              type: array
              items:
                type: array
                items:
                  type: string
        schedule:
          type: string
          nullable: true
          description: Standard 5-field cron expression (e.g. "0 9 * * 1-5")
        max_iterations:
          type: integer
          default: 10
          minimum: 1
          maximum: 100
          description: |
            Maximum number of times any single node may fire in one run.
            Provides loop-safety for cyclic graphs — the node is terminated
            when this cap is exceeded.
        template_name:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time

    WorkflowCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string
        agents:
          type: array
          items:
            type: string
            format: uuid
        graph:
          type: object
        schedule:
          type: string
          nullable: true
          description: 5-field cron expression
        max_iterations:
          type: integer
          default: 10
          minimum: 1
          maximum: 100
        template_name:
          type: string
          nullable: true

    WorkflowUpdate:
      type: object
      description: All fields optional
      properties:
        description:
          type: string
        agents:
          type: array
          items:
            type: string
        graph:
          type: object
        schedule:
          type: string
          nullable: true
        max_iterations:
          type: integer
          minimum: 1
          maximum: 100

    WorkflowTemplate:
      type: object
      properties:
        name:
          type: string
          example: research_summarize
        description:
          type: string
        graph:
          type: object

    WorkflowExecutionResult:
      type: object
      properties:
        workflow_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [completed, error]
        final_output:
          type: string
        steps:
          type: integer

    # ── Message / Log schemas ──────────────────────────────────────────────────

    Message:
      type: object
      properties:
        id:
          type: string
          format: uuid
        from_agent_id:
          type: string
          format: uuid
          nullable: true
        to_agent_id:
          type: string
          format: uuid
          nullable: true
        workflow_id:
          type: string
          format: uuid
          nullable: true
        channel:
          type: string
          example: internal
        content:
          type: string
        metadata:
          type: object
        created_at:
          type: string
          format: date-time

    ExecutionLog:
      type: object
      properties:
        id:
          type: string
          format: uuid
        workflow_id:
          type: string
          format: uuid
          nullable: true
        agent_id:
          type: string
          format: uuid
          nullable: true
        step_name:
          type: string
        status:
          type: string
          enum: [running, success, error, guardrail_blocked]
          description: |
            `guardrail_blocked` — the step was halted by a guardrail rule;
            input or output contained a banned keyword, blocked topic, or
            exceeded a token cap.
        input:
          type: object
        output:
          type: object
        tokens_used:
          type: integer
        cost:
          type: number
          description: Estimated cost in USD (tokens × $0.15/M)
        error:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
